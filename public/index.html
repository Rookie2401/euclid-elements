<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Read the Greek text of Euclid’s Elements, arranged by book and proposition with diagrams from Heiberg’s edition.">
  <meta name="theme-color" content="#f1e8d7">
  <title>Euclid’s Elements — Ecclesia</title>
  <script>try{var t=localStorage.getItem('ecclesia.euclid.theme');if(t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');if(localStorage.getItem('ecclesia.euclid.marks')==='off')document.documentElement.setAttribute('data-level-marks','off');}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=Noto+Serif:ital,wght@0,400;0,500;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap">
  <link rel="stylesheet" href="./reader.css?v=library-1">
  <link rel="stylesheet" href="./golearn.css">
  <script type="module" src="./reader.js?v=library-1"></script>
</head>
<body>
  <div id="app"><p class="status" id="status" role="status" aria-live="polite">Opening the volume…</p></div>
  <dialog id="diagram-dialog" class="diagram-dialog" aria-label="Enlarged diagram">
    <form method="dialog"><button class="dialog-close" aria-label="Close enlarged diagram">×</button></form>
    <figure><img id="large-diagram" alt=""><figcaption id="diagram-caption"></figcaption></figure>
  </dialog>
</body>
</html>
